<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Photo Viewer</title>
	<!-- FontAwesome Icons -->
	<link rel="stylesheet" href=
		"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<!-- Google Fonts -->
	<link rel="stylesheet" href=
		"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
	<!-- External CSS Stylesheet -->
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<!-- Header Section -->
	<header class="app-header">
		<div class="header-brand">
			<div class="brand-icon">
				<i class="fa-solid fa-camera-retro"></i>
			</div>
			<div class="brand-info">
				<h1 id="app-title">Photo Viewer</h1>
				<p id="header-author">
					Author: <span id="author-value">Scanning Metadata...</span></p>
			</div>
		</div>

		<!-- Controls Toolbar -->
		<div class="header-controls">
			<div class="input-group">
				<i class="fa-solid fa-folder-network input-icon"></i>
				<input type="text" id="server-url-input"
					placeholder="Server folder path (e.g., ./images/)" value="./images/" />
				<button id="btn-load-server" class="btn btn-primary">
					<i class="fa-solid fa-cloud-arrow-down"></i> Load Folder
				</button>
			</div>

			<div class="divider"></div>

			<input type="file" id="local-file-input" multiple
				accept="image/jpeg,image/jpg" hidden />
			<button id="btn-browse-local" class="btn btn-secondary">
				<i class="fa-solid fa-folder-open"></i> Open Local Files
			</button>
		</div>
	</header>

	<!-- Main Application Container -->
	<div class="app-container">
		<!-- Sidebar: Thumbnail Gallery -->
		<aside class="sidebar">
			<div class="sidebar-header">
				<span class="sidebar-title">
					<i class="fa-solid fa-images"></i>
					Thumbnails (<span id="thumb-count">0</span>)
				</span>
				<span class="nav-hint">Arrow Keys &#8593; &#8595;</span>
			</div>

			<!-- Scrollable Thumbnail List -->
			<div id="thumbnail-container" class="thumbnail-list">
				<!-- Dynamically generated thumbnail elements -->
			</div>

			<!-- Drag & Drop Zone -->
			<div id="drag-drop-zone" class="drop-zone">
				<i class="fa-solid fa-cloud-arrow-up drop-icon"></i>
				<p class="drop-title">Drop JPEGs Here</p>
				<p class="drop-subtitle">or click to browse local files</p>
			</div>
		</aside>

		<!-- Main Image Display Panel -->
		<main class="main-panel">
			<!-- Loading Spinner Overlay -->
			<div id="main-loader" class="loader-overlay hidden">
				<div class="spinner"></div>
				<p class="loader-text">Parsing EXIF Metadata...</p>
			</div>

			<!-- Image Container -->
			<div class="image-stage">
				<img id="main-image" src="" alt="Main Display" class="main-image hidden" />
			 
				<!-- Floating Nav Buttons -->
				<button id="btn-prev" class="nav-btn prev" title="Previous Image (Up/Left)">
					<i class="fa-solid fa-chevron-left"></i>
				</button>
				<button id="btn-next" class="nav-btn next" title="Next Image (Down/Right)">
					<i class="fa-solid fa-chevron-right"></i>
				</button>
			</div>

			<!-- EXIF Metadata Footer Panel -->
			<footer id="metadata-panel" class="metadata-footer">
				<div class="metadata-content">
					<div class="metadata-primary">
						<div class="title-row">
							<h2 id="meta-title">Select an Image</h2>
							<span id="meta-resolution" class="badge
								resolution-badge">0 &#215; 0</span>
						</div>
						<p id="meta-caption">
							No description or EXIF caption available for this JPEG.</p>
					</div>

					<div class="metadata-tags">
						<div class="badge tag-badge" title="Camera Make & Model">
							<i class="fa-solid fa-camera icon-blue"></i>
							<span id="meta-camera">--</span>
						</div>
						<div class="badge tag-badge" title="Aperture & ISO">
							<i class="fa-solid fa-sliders icon-green"></i>
							<span id="meta-exposure">--</span>
						</div>
						<div class="badge tag-badge" title="Date Taken">
							<i class="fa-regular fa-calendar icon-purple"></i>
							<span id="meta-date">--</span>
						</div>
					</div>
				</div>
			</footer>
		</main>
	</div>

	<!-- External Modular JavaScript -->
	<script src="app.js"></script>
</body>
</html>
