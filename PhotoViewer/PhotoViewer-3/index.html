<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPEG Viewer Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header Area -->
  <header class="app-header">
    <div class="header-info">
      <h1 id="header-title" class="header-title">Loading...</h1>
      <p id="header-artist" class="header-artist"></p>
    </div>
  </header>

  <!-- Content Container -->
  <div class="app-body">
    
    <!-- Side Panel (Thumbnails) -->
    <aside class="sidebar" id="sidebar">
      <div id="thumbnail-container" class="thumbnail-list"></div>
    </aside>

    <!-- Main Display Area -->
    <main class="main-display">
      <button id="btn-prev" class="nav-btn prev-btn" aria-label="Previous Image">&#10094;</button>
      
      <div class="image-wrapper">
        <img id="main-image" src="" alt="Main Gallery Display" />
        <div id="image-caption-box" class="caption-box hidden">
          <p id="image-caption" class="caption-text"></p>
        </div>
      </div>

      <button id="btn-next" class="nav-btn next-btn" aria-label="Next Image">&#10095;</button>
    </main>
    
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
